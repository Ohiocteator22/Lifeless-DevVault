name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller Pillow

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller DevVault.spec --noconfirm

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DevVault\DevVault.exe")) {
            Write-Error "DevVault.exe not found in dist\DevVault"
            exit 1
          }
          $size = (Get-ChildItem "dist\DevVault" -Recurse |
                   Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Build size: $([math]::Round($size, 1)) MB"

      - name: Zip the build
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "dist\DevVault\*" `
                           -DestinationPath "DevVault-$tag-windows-x64.zip" `
                           -Force
          Get-Item "DevVault-$tag-windows-x64.zip" |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DevVault-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
