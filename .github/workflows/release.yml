name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0) — must already exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) {
            Write-Error "No tag provided."
            exit 1
          }
          Write-Host "Releasing: $tag"
          "value=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ---------- guards ----------

      - name: Verify tag matches APP_VERSION
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}".TrimStart('v')
          $line = Get-Content app\core\version.py |
                  Select-String 'APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $line) {
            Write-Error "APP_VERSION not found in app\core\version.py"
            exit 1
          }
          $pyVersion = $line.Matches.Groups[1].Value
          Write-Host "Tag:            $tag"
          Write-Host "APP_VERSION:    $pyVersion"
          if ($tag -ne $pyVersion) {
            Write-Error "Version mismatch — tag=$tag, APP_VERSION=$pyVersion"
            exit 1
          }

      - name: Verify tag matches version_info.txt
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}".TrimStart('v')
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += "0" }
          $expectedTuple = "($($parts -join ', '))"
          $content = Get-Content version_info.txt -Raw
          if ($content -notmatch [regex]::Escape($expectedTuple)) {
            Write-Error "version_info.txt does not contain $expectedTuple"
            exit 1
          }
          if ($content -notmatch "FileVersion',\s*u'$tag'") {
            Write-Error "version_info.txt FileVersion does not match $tag"
            exit 1
          }
          Write-Host "version_info.txt is in sync with $tag"

      - name: Guard — refuse to overwrite existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Delete it first or bump the version."
            exit 1
          }
          Write-Host "No existing release for $tag — proceeding."

      # ---------- build ----------

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller Pillow

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller DevVault.spec --noconfirm

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DevVault\DevVault.exe")) {
            Write-Error "DevVault.exe not found in dist\DevVault"
            exit 1
          }
          $size = (Get-ChildItem "dist\DevVault" -Recurse |
                   Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Build size: $([math]::Round($size, 1)) MB"

      - name: Zip the build
        id: zip
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          $zip = "DevVault-$tag-windows-x64.zip"
          Compress-Archive -Path "dist\DevVault\*" -DestinationPath $zip -Force
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Created $zip ($size MB)"
          "name=$zip" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT

      # ---------- release ----------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: DevVault ${{ steps.tag.outputs.value }}
          files: ${{ steps.zip.outputs.name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- summary ----------

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          $status = "${{ job.status }}"
          $zip = "${{ steps.zip.outputs.name }}"
          $size = "${{ steps.zip.outputs.size }}"
          $summary = @"
          ## DevVault Release — ``$tag``

          | Field | Value |
          |---|---|
          | Tag | ``$tag`` |
          | Status | **$status** |
          | Zip | ``$zip`` |
          | Size | $size MB |
          | Repo | ${{ github.repository }} |
          | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY
